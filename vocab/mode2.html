<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Từ Vựng - Thang Điểm 10 & Playlist Nhạc Nền</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <style>
        * { box-sizing: border-box; }
        body {
            background-color: #0b422a !important; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Patrick Hand', cursive, sans-serif;
            color: #f0fdf4;
        }

        .sketch-container {
            position: relative;
            width: 96% !important;
            max-width: 1400px !important;
            height: 94vh;
            background-color: #0d5234 !important;
            border: 4px solid #3d2216;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5);
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 16px;
        }

        .sticky-header {
            background-color: #5c2f17;
            border-bottom: 3px solid #3d2216;
            padding: 8px 15px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
            gap: 10px;
            flex-wrap: wrap;
        }

        .header-buttons-left {
            display: flex;
            gap: 8px;
            flex-wrap: wrap;
            align-items: center;
        }

        .btn-back {
            background: #e11d48;
            color: #fff;
            border: 2px solid #881337;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            transition: transform 0.1s;
        }
        .btn-back:active { transform: scale(0.92); }

        .btn-quiz {
            background-color: #1d4ed8 !important;
            color: #ffffff;
            font-size: 1.15rem;
            padding: 5px 12px;
            border: 2px solid #1e3a8a;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Patrick Hand', cursive, sans-serif;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.2);
            transition: all 0.1s ease;
        }
        .btn-quiz:hover { opacity: 0.9; transform: translateY(-1px); }
        .btn-quiz:active { transform: translateY(1px); }

        .btn-audio-toggle {
            background-color: #059669 !important;
            border-color: #047857 !important;
        }

        .btn-next-phase {
            background-color: #fecdd3 !important;
            color: #9f1239 !important;
            border: 2px solid #e11d48 !important;
            font-weight: bold;
            font-size: 1.25rem;
            padding: 5px 16px;
            border-radius: 20px;
        }

        .timer-box {
            background-color: #111827;
            border: 2px solid #f59e0b;
            border-radius: 8px;
            padding: 4px 10px;
            font-size: 1.1rem;
            color: #fde047;
            display: flex;
            gap: 10px;
            align-items: center;
            font-family: monospace;
        }

        .round-counter-badge {
            background-color: #431407;
            border: 2px solid #f97316;
            color: #fdba74;
            padding: 4px 12px;
            border-radius: 8px;
            font-size: 1.15rem;
            font-weight: bold;
        }

        .phase-banner {
            background-color: #a7f3d0;
            color: #065f46;
            border: 2px solid #059669;
            border-radius: 25px;
            text-align: center;
            padding: 8px 15px;
            margin: 10px auto 5px auto;
            width: 88%;
            max-width: 950px;
            font-size: 1.25rem;
            font-weight: bold;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 10px 25px 25px 25px;
        }

        .scrollable-content::-webkit-scrollbar { width: 10px; }
        .scrollable-content::-webkit-scrollbar-track { background: #0d5234; }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: #10b981;
            border: 2px solid #065f46;
            border-radius: 6px;
        }

        .word-panel {
            display: flex;
            flex-direction: column;
            gap: 14px;
            width: 100%;
            max-width: 1250px;
            margin: 0 auto;
        }

        .word-row {
            display: flex;
            align-items: center;
            gap: 12px;
            width: 100%;
        }

        .word-index {
            font-size: 1.8rem;
            color: #f0fdf4;
            width: 35px;
            text-align: right;
            font-weight: bold;
        }

        .word-card-question {
            width: 220px;
            min-width: 180px;
            background-color: #580000;
            border: 2px solid #990000;
            border-radius: 10px;
            padding: 8px 12px;
            font-size: 1.35rem;
            color: #ffdddd;
            text-align: center;
            min-height: 56px;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
        }

        .word-checkbox-container {
            display: flex;
            align-items: center;
        }
        .word-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 28px;
            height: 28px;
            border: 2px solid #000;
            border-radius: 6px;
            background-color: #111;
            cursor: pointer;
            position: relative;
        }
        .word-checkbox:checked::after {
            content: '✓';
            font-size: 1.5rem;
            color: #22c55e;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            font-weight: bold;
        }

        .context-display-box {
            flex: 1;
            background-color: #3b1702;
            border: 2px solid #7c2d12;
            border-radius: 12px;
            padding: 10px 18px;
            font-size: 1.25rem;
            color: #fde047;
            min-height: 56px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            gap: 4px;
            cursor: pointer;
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            transition: all 0.2s ease;
        }
        .context-display-box:hover {
            border-color: #f59e0b;
            background-color: #4a1d00;
        }

        .context-example-item {
            color: #fef08a;
            font-size: 1.25rem;
            line-height: 1.4;
            word-break: break-word;
        }

        .highlight-target {
            color: #f59e0b;
            font-weight: bold;
            text-decoration: underline;
        }

        .context-hidden {
            text-align: center;
            letter-spacing: 1px;
            color: #d97706;
            font-style: italic;
        }

        .input-wrapper-column {
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .word-input-box {
            width: 100%;
            background-color: #4a1d00;
            border: 2px solid #7c2d12;
            border-radius: 10px;
            padding: 8px 15px;
            font-size: 1.3rem;
            color: #fde047;
            font-family: 'Patrick Hand', cursive, sans-serif;
            outline: none;
            min-height: 50px;
            transition: border-color 0.15s, box-shadow 0.15s;
        }
        .word-input-box:focus {
            border-color: #f59e0b;
            box-shadow: 0 0 8px rgba(245, 158, 11, 0.5);
            background-color: #5c2400;
        }
        .word-input-box:disabled {
            background-color: #1f0b00 !important;
            border-color: #431407 !important;
            color: #22c55e !important;
            cursor: not-allowed !important;
            opacity: 0.8;
            font-weight: bold;
        }

        /* ANIMATION RUNG RÕ RÀNG & LÓE SÁNG VIỀN KHI GÕ */
        .is-shaking {
            animation: keyShake 0.14s cubic-bezier(.36,.07,.19,.97) !important;
            border-color: #f59e0b !important;
            box-shadow: 0 0 10px rgba(245, 158, 11, 0.7) !important;
        }

        @keyframes keyShake {
            0% { transform: translateX(0); }
            20% { transform: translateX(-5px); }
            40% { transform: translateX(5px); }
            60% { transform: translateX(-3px); }
            80% { transform: translateX(3px); }
            100% { transform: translateX(0); }
        }

        .partial-hint-text {
            font-size: 1.1rem;
            color: #fef08a;
            background-color: #78350f;
            border: 1px dashed #f59e0b;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 2px;
        }

        .wrong-hint-text {
            font-size: 1.1rem;
            color: #fca5a5;
            background-color: #7f1d1d;
            border: 1px dashed #ef4444;
            padding: 4px 10px;
            border-radius: 6px;
            display: inline-block;
            margin-top: 2px;
        }

        .score-badge {
            min-width: 135px;
            background: #331800;
            border: 2px solid #7c2d12;
            border-radius: 8px;
            padding: 6px 10px;
            font-size: 1.05rem;
            color: #fde047;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            font-weight: bold;
            line-height: 1.25;
        }

        .flash-correct { animation: flashGreen 0.6s ease; }
        .flash-partial { animation: flashYellow 0.6s ease; }
        .flash-wrong { animation: flashRed 0.6s ease; }

        @keyframes flashGreen { 0% { background-color: #15803d; } 100% { background-color: #4a1d00; } }
        @keyframes flashYellow { 0% { background-color: #a16207; } 100% { background-color: #4a1d00; } }
        @keyframes flashRed { 0% { background-color: #991b1b; } 100% { background-color: #4a1d00; } }

        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.7);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }
        .modal-card {
            background: #0d5234;
            border: 3px solid #fde047;
            border-radius: 16px;
            padding: 25px 30px;
            width: 90%;
            max-width: 600px;
            color: #fff;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8);
        }
        .modal-title {
            color: #fde047;
            font-size: 1.8rem;
            margin-top: 0;
            text-align: center;
        }
    </style>
</head>
<body>

    <!-- THẺ AUDIO PHÁT NHẠC NỀN -->
    <audio id="bgmAudio" preload="auto"></audio>

    <div class="sketch-container">
        <div class="sticky-header">
            <button class="btn-back" id="backBtn" title="Quay lại trang chủ">←</button>
            <div class="header-buttons-left">
                <button class="btn-quiz btn-audio-toggle" id="toggleBgmBtn">🎵 Bật Nhạc Nền</button>
                <button class="btn-quiz" id="toggleModeBtn">trả lời tiếng anh</button>
                <button class="btn-quiz" id="shuffleBtn">xáo trộn</button>
                <button class="btn-quiz" id="toggleAnswersBtn">hiện đáp án</button>
                <button class="btn-quiz" id="showAllBtn">bỏ tích tất cả</button>
                <button class="btn-quiz" id="promptAiBtn" style="background-color: #9333ea !important; border-color: #6b21a8;">Prompt AI</button>
            </div>
            
            <div class="round-counter-badge" id="roundCounterBadge">
                Vòng: 1
            </div>

            <div class="timer-box">
                <span>⏱️ <span id="timerDisplay">00:00</span></span>
                <span>🏆 <span id="bestTimeDisplay">--:--</span></span>
            </div>

            <button class="btn-quiz btn-next-phase" id="phaseActionButton">nộp bài</button>
        </div>

        <div class="phase-banner" id="phaseBanner">
            Lượt 2: sau khi điền hết hãy ấn xáo trộn để kiểm tra lại lần 2, nếu đã hoàn thành ca học, nhấn nộp bài
        </div>

        <div class="scrollable-content">
            <div class="word-panel" id="wordListContainer">
                <div style="text-align: center; font-size: 1.6rem; color: #fde047; margin-top: 40px;">
                    Đang tải danh sách từ vựng...
                </div>
            </div>
        </div>
    </div>

    <div class="modal-overlay" id="aiPromptModal">
        <div class="modal-card">
            <h3 class="modal-title">🤖 Tạo Prompt Cho AI (ChatGPT / Claude)</h3>
            <p style="font-size: 1.2rem; color: #a7f3d0;">Sao chép Prompt bên dưới, dán vào AI của bạn để tạo dữ liệu từ mới theo đúng định dạng chuẩn:</p>
            <textarea id="aiPromptText" style="width: 100%; height: 180px; background: #042f2e; color: #fde047; border: 2px solid #14b8a6; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 0.95rem; resize: none;" readonly></textarea>
            <div style="display: flex; justify-content: space-between; margin-top: 15px;">
                <button class="btn-quiz" id="closePromptModalBtn" style="background:#ef4444 !important; border-color:#b91c1c;">Đóng</button>
                <button class="btn-quiz" id="copyPromptBtn" style="background:#22c55e !important; border-color:#15803d;">Copy Prompt</button>
            </div>
        </div>
    </div>

    <script>
        const DB_NAME = 'VocabDB';
        const DB_VERSION = 3;
        const STORE_NAME = 'words';

        let db;
        let originalWords = [];    
        let activeWords = [];      
        let currentPhase = 'context'; 
        let currentDisplayMode = 'en'; 
        let showAnswersAll = false;
        let masteredWordIds = new Set(); 
        let wordInputs = {};       
        let sentenceInputs = {};   
        let feedbackHints = {}; 
        
        let completedRounds = 0;       
        let wordScoreHistory = {};     
        let currentRoundScores = {};   
        let frozenAvgScores = {};      

        const bgmPlaylist = [
            "Burgundy - Like You Mean It (freetouse.com).mp3",
            "Dagored - Urban Timelapse (freetouse.com).mp3",
            "Luke Bergs - Sunlight (freetouse.com).mp3"
        ];
        let currentTrackIndex = 0;

        const bgmAudio = document.getElementById('bgmAudio');
        bgmAudio.volume = 0.3; 

        bgmAudio.addEventListener('ended', () => {
            currentTrackIndex = (currentTrackIndex + 1) % bgmPlaylist.length;
            bgmAudio.src = bgmPlaylist[currentTrackIndex];
            bgmAudio.play().catch(err => console.log("Lỗi phát bài tiếp theo:", err));
        });

        function toggleBGM() {
            const btn = document.getElementById('toggleBgmBtn');
            if (bgmAudio.paused) {
                if (!bgmAudio.src || bgmAudio.src === "" || bgmAudio.src.endsWith("mode2.html")) {
                    bgmAudio.src = bgmPlaylist[currentTrackIndex];
                }
                bgmAudio.play().then(() => {
                    btn.textContent = "🔇 Tắt Nhạc Nền";
                }).catch(err => {
                    console.log("Không thể phát audio tự động:", err);
                    alert("Vui lòng tương tác với trang trước khi bật nhạc!");
                });
            } else {
                bgmAudio.pause();
                btn.textContent = "🎵 Bật Nhạc Nền";
            }
        }

        // HỆ THỐNG AUDIO HỖ TRỢ KÍCH HOẠT TỰ ĐỘNG KHÔNG BỊ CHẶN
        let audioCtx = null;
        function getAudioContext() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
            if (audioCtx.state === 'suspended') {
                audioCtx.resume();
            }
            return audioCtx;
        }

        // LẮNG NGHE TƯƠNG TÁC ĐẦU TIÊN CỦA NGƯỜI DÙNG ĐỂ MỞ KHÓA ÂM THANH
        ['click', 'keydown', 'touchstart'].forEach(evt => {
            window.addEventListener(evt, () => { getAudioContext(); }, { once: true });
        });

        // ÂM THANH GÕ PHÍM BÀN PHÍM CƠ NỔI BẬT VÀ RÕ TIẾNG
        function playKeyPressSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();

                osc.type = 'triangle';
                osc.frequency.setValueAtTime(500 + Math.random() * 250, now);
                osc.frequency.exponentialRampToValueAtTime(100, now + 0.05);

                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.001, now + 0.05);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.05);
            } catch (e) {
                console.log("Audio play error:", e);
            }
        }

        function playWrongSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const osc = ctx.createOscillator();
                const gain = ctx.createGain();
                
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(120, now);
                osc.frequency.exponentialRampToValueAtTime(40, now + 0.25);

                gain.gain.setValueAtTime(0.3, now);
                gain.gain.linearRampToValueAtTime(0.01, now + 0.25);

                osc.connect(gain);
                gain.connect(ctx.destination);

                osc.start(now);
                osc.stop(now + 0.25);
            } catch (e) {}
        }

        function playCorrectSound() {
            try {
                const ctx = getAudioContext();
                const now = ctx.currentTime;
                const notes = [523.25, 659.25, 783.99, 1046.50];
                
                notes.forEach((freq, idx) => {
                    const osc = ctx.createOscillator();
                    const gain = ctx.createGain();
                    const startTime = now + idx * 0.06;

                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(freq, startTime);

                    gain.gain.setValueAtTime(0.2, startTime);
                    gain.gain.exponentialRampToValueAtTime(0.001, startTime + 0.2);

                    osc.connect(gain);
                    gain.connect(ctx.destination);

                    osc.start(startTime);
                    osc.stop(startTime + 0.2);
                });
            } catch (e) {}
        }

        // TIMER & LOCAL STORAGE
        let timerSeconds = 0;
        let timerInterval = null;

        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerSeconds = 0;
            const timerDisplay = document.getElementById('timerDisplay');
            const bestDisplay = document.getElementById('bestTimeDisplay');
            
            const bestTime = localStorage.getItem('vocab_best_time');
            if (bestTime) {
                bestDisplay.textContent = formatTime(parseInt(bestTime));
            }

            timerInterval = setInterval(() => {
                timerSeconds++;
                timerDisplay.textContent = formatTime(timerSeconds);
            }, 1000);
        }

        function stopAndSaveTimer() {
            if (timerInterval) clearInterval(timerInterval);
            const bestTime = localStorage.getItem('vocab_best_time');
            if (!bestTime || timerSeconds < parseInt(bestTime)) {
                localStorage.setItem('vocab_best_time', timerSeconds);
                alert(`🏆 Chúc mừng! Bạn đã đạt thời gian học nhanh nhất mới: ${formatTime(timerSeconds)}`);
            }
        }

        function formatTime(totalSec) {
            const m = Math.floor(totalSec / 60).toString().padStart(2, '0');
            const s = (totalSec % 60).toString().padStart(2, '0');
            return `${m}:${s}`;
        }

        function initDB() {
            return new Promise((resolve, reject) => {
                const request = indexedDB.open(DB_NAME, DB_VERSION);
                request.onerror = () => reject(request.error);
                request.onsuccess = () => {
                    db = request.result;
                    resolve(db);
                };
                request.onupgradeneeded = (event) => {
                    const database = event.target.result;
                    if (!database.objectStoreNames.contains(STORE_NAME)) {
                        const store = database.createObjectStore(STORE_NAME, { keyPath: 'id', autoIncrement: true });
                        store.createIndex('english', 'english', { unique: false });
                        store.createIndex('nextReviewDate', 'nextReviewDate', { unique: false });
                    }
                };
            });
        }

        function getTodayString() {
            const localDate = new Date(Date.now() + 7 * 60 * 60 * 1000); 
            return localDate.toISOString().split('T')[0]; 
        }

        function processDuplicates(wordsList) {
            const enCounts = {};
            const viCounts = {};

            wordsList.forEach(w => {
                const en = w.english.trim().toLowerCase();
                const vi = w.vietnamese.trim().toLowerCase();
                enCounts[en] = (enCounts[en] || 0) + 1;
                viCounts[vi] = (viCounts[vi] || 0) + 1;
            });

            const enTracker = {};
            const viTracker = {};

            return wordsList.map(w => {
                const wordCopy = { ...w };
                const en = w.english.trim().toLowerCase();
                const vi = w.vietnamese.trim().toLowerCase();

                if (enCounts[en] > 1) {
                    enTracker[en] = (enTracker[en] || 0) + 1;
                    wordCopy.displayEnglish = `${w.english} (${enTracker[en]})`;
                } else {
                    wordCopy.displayEnglish = w.english;
                }

                if (viCounts[vi] > 1) {
                    viTracker[vi] = (viTracker[vi] || 0) + 1;
                    wordCopy.displayVietnamese = `${w.vietnamese} (${viTracker[vi]})`;
                } else {
                    wordCopy.displayVietnamese = w.vietnamese;
                }

                return wordCopy;
            });
        }

        function loadAndBalanceWords() {
            return new Promise((resolve, reject) => {
                const todayStr = getTodayString();
                const tx = db.transaction(STORE_NAME, 'readonly');
                const store = tx.objectStore(STORE_NAME);
                const request = store.getAll();

                request.onsuccess = () => {
                    const allWords = request.result || [];

                    let dueWords = allWords.filter(word => {
                        if (!word.nextReviewDate) word.nextReviewDate = todayStr;
                        return word.nextReviewDate <= todayStr;
                    });

                    if (dueWords.length > 20) {
                        dueWords = dueWords.slice(0, 20);
                    }

                    originalWords = processDuplicates(dueWords);
                    originalWords.forEach(w => {
                        if (!w.timesLearned) w.timesLearned = 1;
                        wordScoreHistory[w.id] = [];
                    });

                    activeWords = JSON.parse(JSON.stringify(originalWords));
                    resolve();
                };
                request.onerror = () => reject(request.error);
            });
        }

        function getLevenshteinDistance(a, b) {
            a = a.toLowerCase().trim();
            b = b.toLowerCase().trim();
            const matrix = [];

            for (let i = 0; i <= b.length; i++) matrix[i] = [i];
            for (let j = 0; j <= a.length; j++) matrix[0][j] = j;

            for (let i = 1; i <= b.length; i++) {
                for (let j = 1; j <= a.length; j++) {
                    if (b.charAt(i - 1) === a.charAt(j - 1)) {
                        matrix[i][j] = matrix[i - 1][j - 1];
                    } else {
                        matrix[i][j] = Math.min(
                            matrix[i - 1][j - 1] + 1,
                            matrix[i][j - 1] + 1,
                            matrix[i - 1][j] + 1
                        );
                    }
                }
            }
            return matrix[b.length][a.length];
        }

        function calculateAccuracyScore(typed, target) {
            typed = typed.toLowerCase().trim();
            target = target.toLowerCase().trim();

            if (typed === target) return 10;
            if (target.length === 0) return 0;

            const dist = getLevenshteinDistance(typed, target);
            const maxLength = Math.max(typed.length, target.length);

            let accuracy = (1 - (dist / maxLength)) * 10;
            if (accuracy < 0) accuracy = 0;

            return Math.round(accuracy * 10) / 10;
        }

        function getAverageScore(wordId) {
            if (frozenAvgScores[wordId] !== undefined) {
                return frozenAvgScores[wordId];
            }

            const history = wordScoreHistory[wordId] || [];
            const currentScore = currentRoundScores[wordId];

            const allScores = [...history];
            if (currentScore !== undefined) {
                allScores.push(currentScore);
            }

            if (allScores.length === 0) return 0;

            const sum = allScores.reduce((a, b) => a + b, 0);
            return Math.round((sum / allScores.length) * 10) / 10;
        }

        function formatExampleText(str) {
            if (!str) return '';
            return str.replace(/\((.*?)\)/g, '<span class="highlight-target">($1)</span>');
        }

        function render() {
            const container = document.getElementById('wordListContainer');
            container.innerHTML = '';

            document.getElementById('roundCounterBadge').textContent = `Vòng: ${completedRounds + 1}`;

            if (activeWords.length === 0) {
                container.innerHTML = `<div style="text-align:center; font-size:1.6rem; color:#fde047; margin-top:30px;">
                    Không có từ vựng nào cần học hôm nay!
                </div>`;
                return;
            }

            const banner = document.getElementById('phaseBanner');
            const phaseBtn = document.getElementById('phaseActionButton');

            if (currentPhase === 'context') {
                banner.textContent = 'Lượt 1: Ngữ cảnh (Luyện câu ví dụ)';
                phaseBtn.textContent = 'Lượt 2 ->';
            } else {
                banner.textContent = `Lượt 2 (Vòng ${completedRounds + 1}): Sau khi điền hết hãy ấn Xáo Trộn để ôn lại, nếu đã hoàn thành ca học, nhấn Nộp Bài`;
                phaseBtn.textContent = 'Nộp bài';
            }

            activeWords.forEach((word, index) => {
                const wordRow = document.createElement('div');
                wordRow.className = 'word-row';

                const isMastered = masteredWordIds.has(word.id);
                const questionText = currentDisplayMode === 'en' ? word.displayVietnamese : word.displayEnglish;
                const correctAnswer = currentDisplayMode === 'en' ? word.english : word.vietnamese;

                const indexDiv = document.createElement('div');
                indexDiv.className = 'word-index';
                indexDiv.textContent = index + 1;

                const questionCard = document.createElement('div');
                questionCard.className = 'word-card-question';
                questionCard.textContent = questionText;

                const checkboxContainer = document.createElement('div');
                checkboxContainer.className = 'word-checkbox-container';
                const checkbox = document.createElement('input');
                checkbox.type = 'checkbox';
                checkbox.className = 'word-checkbox';
                checkbox.checked = isMastered;

                checkbox.addEventListener('change', () => {
                    if (checkbox.checked) {
                        masteredWordIds.add(word.id);
                        frozenAvgScores[word.id] = getAverageScore(word.id);
                    } else {
                        masteredWordIds.delete(word.id);
                        delete frozenAvgScores[word.id];
                    }
                    render();
                });
                checkboxContainer.appendChild(checkbox);

                wordRow.appendChild(indexDiv);
                wordRow.appendChild(questionCard);
                wordRow.appendChild(checkboxContainer);

                if (currentPhase === 'context') {
                    const isNewWord = (word.timesLearned <= 2);
                    const contextBox = document.createElement('div');
                    contextBox.className = 'context-display-box';

                    const ex1 = word.example1 || `(1. Ví dụ mẫu cho: ${word.english})`;
                    const ex2 = word.example2 || `(2. Ví dụ mẫu cho: ${word.english})`;

                    const formattedEx1 = formatExampleText(ex1);
                    const formattedEx2 = formatExampleText(ex2);

                    if (isNewWord) {
                        contextBox.innerHTML = `
                            <div class="context-example-item">1. ${formattedEx1}</div>
                            <div class="context-example-item">2. ${formattedEx2}</div>
                        `;
                    } else {
                        let isRevealed = word._showContext || false;
                        if (isRevealed) {
                            contextBox.innerHTML = `
                                <div class="context-example-item">1. ${formattedEx1}</div>
                                <div class="context-example-item">2. ${formattedEx2}</div>
                            `;
                        } else {
                            contextBox.innerHTML = `<div class="context-hidden">các từ đã cũ sẽ bị ẩn như này (trừ khi ấn vào)</div>`;
                        }

                        contextBox.addEventListener('click', () => {
                            word._showContext = !word._showContext;
                            render();
                        });
                    }

                    wordRow.appendChild(contextBox);
                } 
                else {
                    const inputColumn = document.createElement('div');
                    inputColumn.className = 'input-wrapper-column';

                    const inputAnswer = document.createElement('input');
                    inputAnswer.type = 'text';
                    inputAnswer.className = 'word-input-box';
                    inputAnswer.dataset.index = index;

                    if (isMastered) {
                        inputAnswer.disabled = true;
                        inputAnswer.value = correctAnswer;
                    } else {
                        inputAnswer.value = showAnswersAll ? correctAnswer : (wordInputs[word.id] || '');
                    }

                    // KÍCH HOẠT ÂM THANH GÕ VÀ LÀM RUNG KHUNG KHI BẤM PHÍM KÝ TỰ / BACKSPACE
                    inputAnswer.addEventListener('keydown', (e) => {
                        if (!e.repeat && (e.key.length === 1 || e.key === 'Backspace' || e.key === 'Delete')) {
                            playKeyPressSound();
                            
                            // Reset Animation để bấm liên tục vẫn rung nảy khung
                            inputAnswer.classList.remove('is-shaking');
                            void inputAnswer.offsetWidth;
                            inputAnswer.classList.add('is-shaking');
                        }

                        if (e.key === 'ArrowDown') {
                            e.preventDefault();
                            let nextIdx = index + 1;
                            while (nextIdx < activeWords.length) {
                                const nextWord = activeWords[nextIdx];
                                if (!masteredWordIds.has(nextWord.id)) {
                                    const nextInput = document.querySelector(`input[data-index="${nextIdx}"]`);
                                    if (nextInput) { nextInput.focus(); break; }
                                }
                                nextIdx++;
                            }
                        } else if (e.key === 'Enter') {
                            e.preventDefault();
                            gradeSingleWord(word, inputAnswer.value, inputAnswer, index, activeWords);
                        }
                    });

                    inputAnswer.addEventListener('animationend', () => {
                        inputAnswer.classList.remove('is-shaking');
                    });

                    inputAnswer.addEventListener('input', (e) => {
                        wordInputs[word.id] = e.target.value;
                    });

                    inputColumn.appendChild(inputAnswer);

                    if (feedbackHints[word.id]) {
                        const hintDiv = document.createElement('div');
                        hintDiv.className = feedbackHints[word.id].type === 'partial' ? 'partial-hint-text' : 'wrong-hint-text';
                        hintDiv.textContent = feedbackHints[word.id].text;
                        inputColumn.appendChild(hintDiv);
                    }

                    const currentScore = currentRoundScores[word.id] !== undefined ? `${currentRoundScores[word.id]}/10` : '--';
                    const avgScore = getAverageScore(word.id);

                    const scoreBadge = document.createElement('div');
                    scoreBadge.className = 'score-badge';
                    scoreBadge.innerHTML = `
                        <div>Lượt này: ${currentScore}</div>
                        <div style="color: #6ee7b7;">TB: ${avgScore}/10</div>
                    `;

                    wordRow.appendChild(inputColumn);
                    wordRow.appendChild(scoreBadge);
                }

                container.appendChild(wordRow);
            });
        }

        function gradeSingleWord(word, userText, inputElement, index, visibleWords) {
            if (!userText || userText.trim() === '') return;

            const correctAnswer = currentDisplayMode === 'en' ? word.english : word.vietnamese;
            
            let rawTyped = userText;
            if (rawTyped.includes('->')) {
                rawTyped = rawTyped.split('->')[0].trim();
            }

            const isExact = (rawTyped.toLowerCase().trim() === correctAnswer.toLowerCase().trim());

            if (currentRoundScores[word.id] === undefined) {
                const calculatedScore = calculateAccuracyScore(rawTyped, correctAnswer);
                currentRoundScores[word.id] = calculatedScore;
            }

            if (isExact) {
                playCorrectSound();
                delete feedbackHints[word.id];
                wordInputs[word.id] = correctAnswer;
                inputElement.classList.add('flash-correct');
                setTimeout(() => inputElement.classList.remove('flash-correct'), 600);

                render();

                let nextIdx = index + 1;
                while (nextIdx < visibleWords.length) {
                    const nextWord = visibleWords[nextIdx];
                    if (!masteredWordIds.has(nextWord.id)) {
                        const nextInput = document.querySelector(`input[data-index="${nextIdx}"]`);
                        if (nextInput) { nextInput.focus(); break; }
                    }
                    nextIdx++;
                }
            } else {
                playWrongSound();
                const dist = getLevenshteinDistance(rawTyped, correctAnswer);

                if (dist <= 2) {
                    feedbackHints[word.id] = {
                        type: 'partial',
                        text: `${rawTyped} !sai ít! ${correctAnswer}`
                    };
                    inputElement.classList.add('flash-partial');
                    setTimeout(() => inputElement.classList.remove('flash-partial'), 600);
                } else {
                    feedbackHints[word.id] = {
                        type: 'wrong',
                        text: `Chưa chính xác! Đáp án đúng: ${correctAnswer}`
                    };
                    inputElement.classList.add('flash-wrong');
                    setTimeout(() => inputElement.classList.remove('flash-wrong'), 600);
                }

                wordInputs[word.id] = rawTyped;
                render();

                setTimeout(() => {
                    const currentInput = document.querySelector(`input[data-index="${index}"]`);
                    if (currentInput) {
                        currentInput.focus();
                        currentInput.select();
                    }
                }, 50);
            }
        }

        function validateAllInputsFilled() {
            if (currentPhase === 'context') return true;
            for (let word of activeWords) {
                if (masteredWordIds.has(word.id)) continue; 
                const val = wordInputs[word.id];
                if (!val || val.trim().length === 0) return false;
            }
            return true;
        }

        function shuffleWords() {
            if (currentPhase === 'main' && !validateAllInputsFilled()) {
                alert("⚠️ Chỉ khi mọi ô (chưa tích) đã được điền ít nhất 1 chữ thì mới được nhấn Xáo Trộn hoặc Nộp Bài!");
                return;
            }

            if (currentPhase === 'main') {
                activeWords.forEach(word => {
                    if (!masteredWordIds.has(word.id)) {
                        let score = currentRoundScores[word.id];
                        if (score === undefined) {
                            const text = wordInputs[word.id] || '';
                            let rawTyped = text.includes('->') ? text.split('->')[0].trim() : text;
                            const correctAnswer = currentDisplayMode === 'en' ? word.english : word.vietnamese;
                            score = calculateAccuracyScore(rawTyped, correctAnswer);
                        }
                        if (!wordScoreHistory[word.id]) wordScoreHistory[word.id] = [];
                        wordScoreHistory[word.id].push(score);
                    } else {
                        if (!wordScoreHistory[word.id]) wordScoreHistory[word.id] = [];
                        wordScoreHistory[word.id].push(10);
                    }
                });

                completedRounds++;
                currentRoundScores = {}; 

                if (completedRounds >= 2) {
                    activeWords.forEach(word => {
                        const avgScore = getAverageScore(word.id);
                        if (avgScore >= 10 && !masteredWordIds.has(word.id)) {
                            masteredWordIds.add(word.id);
                            frozenAvgScores[word.id] = avgScore;
                        }
                    });
                }
            }

            for (let i = activeWords.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [activeWords[i], activeWords[j]] = [activeWords[j], activeWords[i]];
            }

            wordInputs = {};
            feedbackHints = {};
            showAnswersAll = false;
            render();
        }

        function submitAndFinish() {
            if (!validateAllInputsFilled()) {
                alert("⚠️ Chỉ khi mọi ô (chưa tích) đã được điền ít nhất 1 chữ thì mới được nhấn Nộp Bài!");
                return;
            }

            stopAndSaveTimer();

            const tx = db.transaction(STORE_NAME, 'readwrite');
            const store = tx.objectStore(STORE_NAME);

            originalWords.forEach(word => {
                const finalAvgScore = getAverageScore(word.id);
                word.timesLearned = (word.timesLearned || 1) + 1;

                let currentInterval = word.interval || 1;
                let newInterval = 1;

                if (finalAvgScore >= 9) {
                    newInterval = currentInterval === 1 ? 4 : Math.round(currentInterval * 2.3);
                } else if (finalAvgScore >= 5) {
                    newInterval = currentInterval === 1 ? 2 : Math.round(currentInterval * 1.5);
                } else if (finalAvgScore >= 3) {
                    newInterval = currentInterval === 1 ? 1 : Math.round(currentInterval * 1.2);
                } else {
                    newInterval = 1; 
                }

                word.interval = newInterval;
                const nextDate = new Date();
                nextDate.setDate(nextDate.getDate() + newInterval);
                word.nextReviewDate = nextDate.toISOString().split('T')[0];

                delete word.displayEnglish;
                delete word.displayVietnamese;

                store.put(word);
            });

            tx.oncomplete = () => {
                alert("🎉 Đã hoàn thành ca học! Kết quả đã được ghi nhận vào hệ thống.");
                window.location.href = 'vocab.html';
            };
        }

        document.getElementById('toggleBgmBtn').addEventListener('click', toggleBGM);

        document.getElementById('phaseActionButton').addEventListener('click', () => {
            if (currentPhase === 'context') {
                currentPhase = 'main';
                startTimer();
                render();
            } else {
                submitAndFinish();
            }
        });

        document.getElementById('shuffleBtn').addEventListener('click', shuffleWords);

        document.getElementById('toggleModeBtn').addEventListener('click', (e) => {
            if (currentDisplayMode === 'en') {
                currentDisplayMode = 'vi';
                e.target.textContent = "trả lời tiếng việt";
            } else {
                currentDisplayMode = 'en';
                e.target.textContent = "trả lời tiếng anh";
            }
            render();
        });

        document.getElementById('toggleAnswersBtn').addEventListener('click', () => {
            showAnswersAll = !showAnswersAll;
            render();
        });

        document.getElementById('showAllBtn').addEventListener('click', () => {
            masteredWordIds.clear();
            frozenAvgScores = {};
            render();
        });

        document.getElementById('backBtn').addEventListener('click', () => {
            window.location.href = 'vocab.html';
        });

        const promptModal = document.getElementById('aiPromptModal');
        document.getElementById('promptAiBtn').addEventListener('click', () => {
            const samplePrompt = `Hãy đóng vai giáo viên tiếng Anh. Hãy cho tôi 10 từ vựng ngẫu nhiên trình độ B1/B2.
Mỗi từ gồm: "english", "vietnamese", "example1", "example2" (từ mới được bọc ngoặc đơn trong ví dụ).
Trả về JSON thuần mảng:
[
  {
    "english": "enhance",
    "vietnamese": "nâng cao",
    "example1": "You can (enhance) your skills by practicing daily.",
    "example2": "The new feature will (enhance) user experience."
  }
]`;
            document.getElementById('aiPromptText').value = samplePrompt;
            promptModal.classList.add('active');
        });

        document.getElementById('closePromptModalBtn').addEventListener('click', () => {
            promptModal.classList.remove('active');
        });

        document.getElementById('copyPromptBtn').addEventListener('click', () => {
            const copyText = document.getElementById('aiPromptText');
            copyText.select();
            navigator.clipboard.writeText(copyText.value);
            alert("Đã sao chép Prompt vào bộ nhớ tạm!");
        });

        window.addEventListener('DOMContentLoaded', async () => {
            try {
                await initDB();
                await loadAndBalanceWords();
                render();
            } catch (err) {
                console.error("Lỗi khởi chạy hệ thống:", err);
            }
        });
    </script>
</body>
