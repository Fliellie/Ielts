<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kiểm Tra Miệng</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Patrick+Hand&display=swap" rel="stylesheet">
    
    <style>
        body {
            background-color: #a8ebd0 !important; 
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: 'Patrick Hand', cursive, sans-serif;
        }

        /* Khung chính mở rộng gần như Full Màn Hình */
        .sketch-container {
            position: relative;
            width: 96% !important;
            max-width: 1400px !important;
            height: 92vh;
            background-color: #a8ebd0 !important;
            border: 3px double #C93638;
            box-shadow: none;
            padding: 0 !important;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            border-radius: 12px;
        }

        /* Header linh hoạt chứa các nút và nút Nộp bài ở góc phải */
        .sticky-header {
            background-color: #fef08a;
            border-bottom: 2px solid #C93638;
            padding: 12px 25px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            z-index: 10;
        }

        .header-buttons-left {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }

        .scrollable-content {
            flex: 1;
            overflow-y: auto;
            padding: 20px 40px 40px 40px;
        }

        .scrollable-content::-webkit-scrollbar { width: 10px; }
        .scrollable-content::-webkit-scrollbar-track { background: #a8ebd0; }
        .scrollable-content::-webkit-scrollbar-thumb {
            background: #90cdf4;
            border: 2px solid #C93638;
            border-radius: 6px;
        }

        .instruction-text {
            font-size: 1.6rem;
            color: #d97706;
            text-align: center;
            margin-bottom: 5px;
        }

        .note-text {
            font-size: 1.2rem;
            color: #d97706;
            text-align: center;
            margin-bottom: 20px;
            font-style: italic;
        }

        .word-panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
            width: 100%;
            max-width: 1100px;
            margin: 0 auto;
        }

        .word-row {
            display: flex;
            align-items: center;
            gap: 15px;
            width: 100%;
        }

        .word-index {
            font-size: 2.2rem;
            color: #2d3748;
            width: 35px;
            text-align: right;
        }

        .word-card-question {
            flex: 1;
            background-color: #ffb3b3;
            border: 2px solid #C93638;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 1.5rem;
            color: #000;
            text-align: center;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .word-card-answer {
            flex: 1;
            background-color: #fef08a;
            border: 2px solid #C93638;
            border-radius: 12px;
            padding: 10px 15px;
            font-size: 1.5rem;
            color: #000;
            text-align: center;
            min-height: 32px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* Checkbox ẩn từ khi đã thuộc */
        .word-checkbox-container {
            display: flex;
            align-items: center;
        }
        .word-checkbox {
            appearance: none;
            -webkit-appearance: none;
            width: 32px;
            height: 32px;
            border: 2px solid #C93638;
            border-radius: 8px;
            background-color: #fff;
            cursor: pointer;
            position: relative;
        }
        .word-checkbox:checked::after {
            content: '✓';
            font-size: 1.8rem;
            color: #d97706;
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -55%);
            font-weight: bold;
        }

        /* Nút lật xem đáp án riêng cho từng từ */
        .btn-reveal-single {
            width: 36px;
            height: 36px;
            background-color: #a8ebd0;
            border: 2px solid #C93638;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            transition: transform 0.1s;
        }
        .btn-reveal-single:active { transform: scale(0.95); }

        /* Trạng thái khi từ bị ẩn */
        .word-row.hidden-word .word-card-question,
        .word-row.hidden-word .word-card-answer {
            color: transparent !important;
            text-shadow: none !important;
        }

        /* Định dạng chung nút bấm */
        .btn-quiz {
            background-color: #90cdf4 !important;
            font-size: 1.3rem;
            padding: 8px 16px;
            border: 2px solid #C93638;
            border-radius: 8px;
            cursor: pointer;
            font-family: 'Patrick Hand', cursive, sans-serif;
            box-shadow: 2px 2px 0px rgba(0,0,0,0.1);
        }
        .btn-submit {
            background-color: #ffb3b3 !important;
            font-weight: bold;
        }

        .btn-back {
            position: absolute;
            top: 12px;
            left: 15px;
            z-index: 11;
            background: #ffb3b3;
            border: 2px solid #C93638;
            border-radius: 50%;
            width: 38px;
            height: 38px;
            font-size: 1.4rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        /* --- POPUP MODAL NỘP BÀI --- */
        .modal-overlay {
            position: fixed;
            top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.4);
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 100;
        }
        .modal-overlay.active { display: flex; }

        .modal-card {
            background: #a8ebd0;
            border: 3px solid #C93638;
            border-radius: 16px;
            padding: 25px 35px;
            width: 90%;
            max-width: 650px;
            max-height: 80vh;
            display: flex;
            flex-direction: column;
            box-shadow: 4px 4px 0px rgba(0,0,0,0.15);
        }

        .modal-title {
            color: #C93638;
            font-size: 1.8rem;
            text-align: center;
            margin: 0 0 15px 0;
        }

        .rating-list {
            overflow-y: auto;
            flex: 1;
            padding-right: 10px;
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .rating-row {
            display: flex;
            align-items: center;
            gap: 15px;
        }

        .rating-word-box {
            flex: 1;
            background: #fff;
            border: 2px solid #C93638;
            border-radius: 8px;
            padding: 6px 12px;
            font-size: 1.3rem;
            text-align: center;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .rating-options {
            display: flex;
            gap: 10px;
        }

        .rating-circle {
            width: 32px;
            height: 32px;
            border: 2px solid #C93638;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.2rem;
            cursor: pointer;
            background: #fff;
            user-select: none;
        }

        .rating-circle.selected {
            background: #C93638;
            color: #fff;
            font-weight: bold;
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            margin-top: 20px;
            padding-top: 10px;
        }
    </style>
</head>
<body>

    <div class="sketch-container">
        <button class="btn-back" id="backBtn">←</button>

        <div class="sticky-header">
            <div style="width: 40px;"></div> <!-- Spacer căn lề nút Back -->
            <div class="header-buttons-left">
                <button class="btn btn-quiz" id="toggleModeBtn">trả lời tiếng anh</button>
                <button class="btn btn-quiz" id="shuffleBtn">xáo trộn</button>
                <button class="btn btn-quiz" id="toggleAnswersBtn">hiện đáp án</button>
                <button class="btn btn-quiz" id="showAllBtn">hiện tất cả</button>
            </div>
            <button class="btn btn-quiz btn-submit" id="submitBtn">nộp bài</button>
        </div>

        <div class="scrollable-content">
            <p class="instruction-text">
                Hãy tích vào ô ở giữa để đánh dấu bạn đã nhớ từ đó ở phiên hiện tại
            </p>
            <p class="note-text">lưu ý : nhấn dấu cách để biết toàn bộ đáp án, dùng ô xanh mint góc phải để xem đáp án từng từ, tích chọn để ẩn từ đã thuộc</p>

            <div class="word-panel" id="wordListContainer">
                <div style="text-align: center; font-size: 1.5rem;">Đang tải danh sách từ hôm nay...</div>
            </div>
        </div>
    </div>

    <!-- POPUP NỘP BÀI ĐÁNH GIÁ MỨC ĐỘ THUỘC -->
    <div class="modal-overlay" id="ratingModal">
        <div class="modal-card">
            <h3 class="modal-title">đánh giá mức độ thuộc của các từ bạn học hôm nay</h3>
            <div class="rating-list" id="ratingList">
                <!-- Các hàng đánh giá sẽ tự động render tại đây -->
            </div>
            <div class="modal-actions">
                <button class="btn btn-quiz" id="modalBackBtn" style="background:#ffb3b3 !important;">Back</button>
                <button class="btn btn-quiz" id="modalOkBtn" style="background:#fef08a !important;">OK</button>
            </div>
        </div>
    </div>

    <script src="mode2.js"></script>
</body>
</html>
